name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run botec golden tests
        run: python -m unittest test_botec -v
        working-directory: system-design/scripts
      - name: Calculator smoke test
        run: python botec.py full --dau 1000000 --reads-per-user 50 --writes-per-user 5
        working-directory: system-design/scripts
      - name: Run gatecheck golden tests
        run: python -m unittest test_gatecheck -v
        working-directory: system-design/scripts
      - name: Gate-check example design docs (verbatim eval outputs)
        run: |
          python system-design/scripts/gatecheck.py examples/design-url-shortener.md
          python system-design/scripts/gatecheck.py examples/design-rate-limiter.md

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate skill structure and frontmatter
        run: python tools/validate_skill.py
      - name: Validate evals JSON
        run: python tools/validate_evals.py
      - name: Validate trigger evals JSON
        run: python tools/validate_trigger_evals.py

  validate-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installer syntax check
        run: |
          bash -n install.sh
          bash install.sh --list | grep -q "claude-code"
      - name: Installer dry run
        run: bash install.sh --dry-run --only=claude-code
